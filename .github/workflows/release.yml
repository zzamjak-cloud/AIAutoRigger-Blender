name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SERIES: "5.2"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 태그와 매니페스트 버전 일치 확인
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' blender_manifest.toml)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "태그 ${GITHUB_REF_NAME} != 매니페스트 v${version}"; exit 1; }
      - name: 단위·정적 검사
        run: python -m unittest discover -s tests
      - name: Blender 설치
        run: |
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" -o "$RUNNER_TEMP/blender.tar.xz"
          # 저장소 밖에 풀어야 Extension 빌드에 섞이지 않는다
          mkdir "$RUNNER_TEMP/blender" && tar -xf "$RUNNER_TEMP/blender.tar.xz" -C "$RUNNER_TEMP/blender" --strip-components=1
      - name: 플랫폼별 Extension 빌드
        run: |
          python scripts/fetch_wheels.py
          "$RUNNER_TEMP/blender/blender" --factory-startup --command extension validate .
          mkdir -p dist
          "$RUNNER_TEMP/blender/blender" --factory-startup --command extension build --split-platforms --source-dir . --output-dir dist
          for z in dist/*.zip; do "$RUNNER_TEMP/blender/blender" --factory-startup --command extension validate "$z"; done
          # 패키지에 불필요한 파일이 섞이면(예: Blender 배포본) 크기로 잡아낸다
          for z in dist/*.zip; do size=$(stat -c %s "$z"); test "$size" -lt 52428800 || { echo "$z 가 50MB 를 넘습니다 ($size)"; exit 1; }; done
      - name: GitHub Release 생성
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CHANGELOG 에서 이 버전 절만 릴리스 노트로 쓴다
          awk -v v="## [${GITHUB_REF_NAME#v}]" '$0==v{f=1;next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
