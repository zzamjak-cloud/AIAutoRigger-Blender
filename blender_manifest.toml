schema_version = "1.0.0"

id = "ai_auto_rigger"
version = "0.7.6"
name = "AI Auto Rigger"
tagline = "AI agent assisted automatic character rigging"
maintainer = "zzamjak-cloud"
type = "add-on"
website = "https://github.com/zzamjak-cloud/AIAutoRigger-Blender"

tags = ["Rigging", "Animation"]

blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]

platforms = ["macos-arm64", "macos-x64", "windows-x64", "linux-x64"]

