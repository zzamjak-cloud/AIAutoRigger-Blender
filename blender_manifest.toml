[permissions]
network = "Send renders to Claude Code, Codex or the Claude API"
files = "Export rigged characters as FBX files"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/.github/",
  "/.omc/",
  "/.claude/",
  "/scripts/",
  "/tests/",
  "/docs/",
  "/dist/",
  "/build/",
  "/blender/",
  "*.tar.xz",
  "/.gitignore",
  "*.zip",
]
