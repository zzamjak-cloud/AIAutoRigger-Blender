# 평가 데이터셋 출처 목록.
# 모델 파일은 저장소에 커밋하지 않는다. 각 출처에서 직접 내려받아 아래 구조로 배치한 뒤
#   scripts/dev_run.sh --background --python scripts/eval_run.py -- --data <eval-data> --out dist/eval
# 로 실행한다. 범주 폴더 이름에 "quad" 가 있으면 4족으로 평가한다.
#
#   <eval-data>/biped_realistic/*.fbx|glb
#   <eval-data>/biped_stylized/*.fbx|glb
#   <eval-data>/quadruped/*.fbx|glb
#
# license_checked 가 false 인 항목은 사용 전 출처 페이지의 라이선스를 직접 확인한다.

